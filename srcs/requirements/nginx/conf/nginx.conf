server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # process only the rea that is asking for this domain
    server_name eabushak.42.fr;

    # encryption protocols
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    root /var/www/html;
    index index.php index.html index.htm;

    # Handle standard requests and WordPress permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Handle PHP requests by forwarding them to the WordPress container
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000; # Uses Docker DNS to reach the WordPress container
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny execution of PHP scripts inside upload directories
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}